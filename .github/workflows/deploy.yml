name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (tag, branch, or SHA). Leave empty to deploy the ref this run was started from."
        required: false
        default: ""
  # Publishing follows the Release workflow, so the live site cannot drift
  # behind a release the way it did between v0.7.0 and v0.8.0 — five merges
  # during which the only deploy was a manual one nobody ran.
  #
  # `workflow_run` rather than `release: published`: Release creates its release
  # with `secrets.GITHUB_TOKEN`, and GitHub does not start workflows from events
  # raised by that token. A `release` trigger here would read correctly and
  # never once fire, which is the same silent gap this is meant to close.
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # A failed Release leaves the tag and the release notes in whatever state it
    # got to, so its head is not something to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Whatever Release actually ran on, so the deploy publishes the commit
          # that was released rather than whatever main has drifted to since.
          # Both sides are empty for a dispatch with no ref, which checks out the
          # ref the run was started from.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @release/web build
        env:
          VITE_BASE_URL: /ReleaseBoardGameP2P/
          # Self-hosted signaling server (apps/peerserver). Unset repo variables
          # yield empty strings, and the client falls back to the PeerJS public
          # cloud — so this is a no-op until the variables are configured.
          VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
          # TURN relay (coturn, deployed alongside the signaling server).
          # Players behind symmetric NAT, a VPN, or blocked UDP cannot connect
          # without it. Unset variables leave PeerJS on its bundled defaults.
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}

      # SPA fallback: @generouted/react-router uses the history API, so deep
      # links / hard refreshes (e.g. /lobby/<code>) would hit GitHub's generic
      # 404 on Pages without a catch-all. Serving index.html as 404.html lets
      # the client router resolve the route.
      - name: Add SPA 404 fallback
        run: cp apps/frontend/dist/index.html apps/frontend/dist/404.html

      # Co-locate the playground showcase under <base>/playground/. Its router
      # derives basename from import.meta.env.BASE_URL, so the build base must be
      # the full sub-path. Published alongside the app inside the same dist dir.
      - name: Build playground
        run: pnpm --filter @release/playground build
        env:
          VITE_BASE_URL: /ReleaseBoardGameP2P/playground/

      - name: Stage playground under /playground
        run: cp -r apps/playground/dist apps/frontend/dist/playground

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/frontend/dist
