name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # The version-bump commit pushed back to main carries [skip ci], but guard
    # against it anyway so a release never triggers another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # main is protected (PR + review required), so GITHUB_TOKEN cannot push
      # the version-bump commit. RELEASE_TOKEN is a token of a repo admin
      # (admins bypass the protection): a fine-grained PAT with
      # "Contents: read and write" on this repo.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bumps package.json, commits it to main, tags vX.Y.Z and publishes the
      # GitHub release with generated notes (see .releaserc.json).
      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Summary
        if: steps.release.outputs.new_release_published == 'true'
        run: echo "Released **${{ steps.release.outputs.new_release_git_tag }}**" >> "$GITHUB_STEP_SUMMARY"
